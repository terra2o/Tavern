name: Windows Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install mingw-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686

      - name: Build
        run: make windows

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: ./bin/tavern.exe
