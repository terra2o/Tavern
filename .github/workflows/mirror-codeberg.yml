name: Mirror to Codeberg
on:
  push:
    branches: ['**']
    tags: ['**']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to Codeberg
        run: |
          git remote add codeberg https://terra2o:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/terra2o/Tavern.git
          git push codeberg --mirror
